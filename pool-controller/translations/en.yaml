configuration:
  serial_port:
    name: Serial Port
    description: >-
      The RS-485 serial adapter connected to your Pentair pool equipment
      (e.g., /dev/ttyUSB0 or /dev/ttyAMA0).
  log_level:
    name: Log Level
    description: >-
      Verbosity of the nodejs-poolController log output. Use "info" for normal
      operation; "debug" or "silly" for troubleshooting.
