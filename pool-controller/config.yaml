name: "Pool Controller"
description: "Pentair pool equipment controller using nodejs-poolController with dashPanel UI"
version: "1.0.9"
slug: pool-controller
url: "https://github.com/jrhubott/ha-pool-controller"
arch:
  - amd64
  - aarch64
init: false
startup: services
ingress: true
ingress_port: 5150
ingress_stream: true
panel_icon: "mdi:pool"
panel_title: "Pool"
ports:
  4200/tcp: 4200
ports_description:
  4200/tcp: "njspc REST API / Socket.IO"
map:
  - share:rw
uart: true
options:
  serial_port: ""
  log_level: "info"
  mqtt_enabled: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  serial_port: device(subsystem=tty)
  log_level: list(error|warn|info|debug|silly)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
